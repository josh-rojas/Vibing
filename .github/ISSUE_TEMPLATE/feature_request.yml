name: Website Feature Request
description: Suggest an improvement for the Vibing website or documentation
title: "[Website Feature]: "
labels: ["enhancement", "triage", "website"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature for the website!

        **Note:** This is for suggestions about the **website or documentation only**.
        For feature requests for the Vibing desktop application, please use the in-app feedback.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like
      placeholder: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe alternatives you've considered
      placeholder: A clear and concise description of any alternative solutions or features you've considered.

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context or screenshots about the feature request here.
